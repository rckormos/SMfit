[build-system]
requires = ["hatchling>=1.32,<2"]
build-backend = "hatchling.build"

[project]
name = "progress-kinetics"
version = "0.1.0"
description = "Enzyme-agnostic, labeled global Schnell–Mendoza progress-curve fitting"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3", "torch>=2.2,<3", "xarray>=2024.6,<2027",
  "scipy>=1.12,<2", "matplotlib>=3.8,<4", "h5netcdf>=1.3,<2", "h5py>=3.10,<4",
  "zarr>=2.18,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.5,<1"]

[project.scripts]
progress-fit = "progress_kinetics.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/progress_kinetics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
